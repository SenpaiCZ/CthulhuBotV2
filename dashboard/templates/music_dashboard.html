{% extends 'base.html' %}

{% block title %}Music Dashboard — CthulhuBot{% endblock %}

{% block content %}
<div class="mb-4 d-flex align-items-end justify-content-between">
    <div>
        <div class="label">Atmosphere</div>
        <h2 class="serif" style="fontSize:32px; margin:8px 0 0">Music Dashboard</h2>
    </div>
    <div id="refresh-indicator" class="mono d-none d-sm-block" style="font-size:9px; letter-spacing:0.18em; color:var(--sigil)">RESONANCE: SYNCED</div>
</div>

<div id="cache-container" class="mb-4"></div>

<div id="scenes-container" class="mb-4"></div>

<div id="diag-container" class="mb-4"></div>

<div id="guilds-container">
    <div id="loading-spinner" class="text-center py-5">
        <span class="pulse-dot" style="display:inline-block; width:12px; height:12px; background:var(--sigil); border-radius:50%"></span>
        <div class="label mt-3">Summoning audio streams...</div>
    </div>
</div>

<style>
.music-card { 
    background: linear-gradient(160deg, var(--void-1), var(--void-0));
    border: 1px solid var(--hair);
    position: relative;
    margin-bottom: 2rem;
}
.music-card-header { 
    background: rgba(var(--theme-primary-rgb), 0.05); 
    border-bottom: 1px solid var(--hair); 
    padding: 1rem 1.5rem; 
    display: flex; 
    align-items: center; 
    gap: 12px; 
}
.music-card-header .guild-name { 
    font-family: var(--font-serif);
    font-size: 1.25rem;
    color: var(--sigil); 
}
.music-body { padding: 1.5rem; }

/* Now Playing */
.now-playing { display: flex; gap: 1.5rem; align-items: flex-start; }
.track-art { width: 140px; height: 105px; object-fit: cover; border: 1px solid var(--hair-strong); flex-shrink: 0; background: #000; }
.track-art-placeholder { width: 140px; height: 105px; border: 1px solid var(--hair-strong); flex-shrink: 0; background: var(--void-2); display: flex; align-items: center; justify-content: center; font-size: 2rem; color: var(--sigil-deep); }
.track-info { flex: 1; min-width: 0; }
.track-title { font-family: var(--font-serif); font-size: 1.4rem; color: var(--bone); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 8px; }
.track-title a { color: inherit; text-decoration: none; border-bottom: 1px solid transparent; transition: all .2s; }
.track-title a:hover { color: var(--sigil); border-bottom-color: var(--sigil); }
.track-badges { margin-bottom: 12px; display: flex; gap: 8px; flex-wrap: wrap; }

/* Progress bar */
.progress-row { margin-top: 12px; }
.progress-bar-wrapper { height: 4px; background: var(--void-4); overflow: hidden; margin-bottom: 8px; position: relative; }
.progress-bar-fill { height: 100%; background: var(--sigil); transition: width 1s linear; box-shadow: 0 0 10px var(--sigil-g); }
.progress-times { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 10px; color: var(--bone-fade); letter-spacing: 0.1em; }

/* Volume */
.volume-row { display: flex; align-items: center; gap: 12px; margin-top: 16px; }
.volume-row label { font-size: 14px; color: var(--bone-fade); }
.volume-row input[type=range] { flex: 1; accent-color: var(--sigil); }
.volume-pct { font-family: var(--font-mono); font-size: 11px; color: var(--sigil); min-width: 40px; text-align: right; }

/* Controls */
.controls-row { display: flex; gap: 8px; margin-top: 20px; flex-wrap: wrap; }

/* Queue */
.queue-section { border-top: 1px solid var(--hair); padding: 1.25rem 1.5rem; background: rgba(0,0,0,0.2); }
.queue-title { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.22em; color: var(--sigil); margin-bottom: 12px; text-transform: uppercase; }
.queue-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--hair); }
.queue-item:last-child { border-bottom: none; }
.queue-item-title { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 400px; color: var(--bone-dim); transition: color .2s; }
.queue-item-title:hover { color: var(--bone); }
.queue-item-dur { font-family: var(--font-mono); font-size: 10px; color: var(--bone-fade); margin: 0 12px; }

@media (max-width: 575.98px) {
    .now-playing { flex-direction: column; align-items: center; text-align: center; }
    .track-art, .track-art-placeholder { width: 100%; height: auto; aspect-ratio: 4/3; }
    .track-info { width: 100%; }
    .controls-row { justify-content: center; }
    .queue-item-title { max-width: 200px; }
}
</style>

<script>
const REFRESH_MS = 3000;
let refreshTimer = null;
let guildInputState = {}; // guildId -> { query: '', channelId: '' }
let sceneEditorOpen = false;
let latestMusicData = null;

function fmtDur(sec) {
    if (!sec || sec <= 0) return null;
    sec = Math.floor(sec);
    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60);
    const s = sec % 60;
    if (h > 0) return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function escHtml(t) {
    if (!t) return '';
    return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}

function progressBar(elapsed, duration, guildId) {
    if (!duration || duration <= 0) return '';
    const pct = Math.min(100, Math.max(0, (elapsed / duration) * 100)).toFixed(1);
    const elStr = fmtDur(elapsed) || '0:00';
    const durStr = fmtDur(duration) || '?:??';
    return `
        <div class="progress-row">
            <div class="progress-bar-wrapper" onclick="seekClick(event, '${guildId}', ${duration})">
                <div class="progress-bar-fill" style="width:${pct}%"></div>
            </div>
            <div class="progress-times"><span>${elStr}</span><span>${durStr}</span></div>
        </div>`;
}

function seekClick(evt, guildId, duration) {
    const rect = evt.currentTarget.getBoundingClientRect();
    const frac = Math.min(1, Math.max(0, (evt.clientX - rect.left) / rect.width));
    ctrl(guildId, 'seek', null, null, frac * duration);
}

function getGuildSelectedChannel(guildId, guildData) {
    const st = guildInputState[guildId] || {};
    if (st.channelId) return st.channelId;
    if (guildData && guildData.connected_channel_id) return guildData.connected_channel_id;
    const vcs = (guildData && guildData.voice_channels) || [];
    const withMembers = vcs.find(v => v.members > 0);
    if (withMembers) return withMembers.id;
    return vcs.length > 0 ? vcs[0].id : '';
}

function onGuildChannelChange(guildId, val) {
    if (!guildInputState[guildId]) guildInputState[guildId] = { query: '', channelId: '' };
    guildInputState[guildId].channelId = val;
}

function onGuildQueryInput(guildId, val) {
    if (!guildInputState[guildId]) guildInputState[guildId] = { query: '', channelId: '' };
    guildInputState[guildId].query = val;
}

async function directPlay(guildId, mode) {
    const qInput = document.getElementById(`direct-query-${guildId}`);
    const vcSelect = document.getElementById(`direct-vc-${guildId}`);
    const query = (qInput ? qInput.value : (guildInputState[guildId]?.query || '')).trim();
    const channelId = vcSelect ? vcSelect.value : (guildInputState[guildId]?.channelId || '');

    if (!query) {
        alert('Zadejte YouTube URL, playlist nebo název skladby k vyhledání.');
        return;
    }

    const resp = await fetch('/api/music/control', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            guild_id: guildId,
            action: 'play',
            query: query,
            channel_id: channelId,
            play_next: mode === 'next',
            replace_current: mode === 'replace'
        })
    });
    const res = await resp.json().catch(() => ({}));
    if (!resp.ok || res.status === 'error') {
        alert(res.message || 'Přehrávání selhalo.');
        return;
    }
    if (guildInputState[guildId]) guildInputState[guildId].query = '';
    if (qInput) qInput.value = '';
    await updateMusicData(true);
}

function renderGuild(guildId, guildData) {
    const track = guildData.current_track;
    const queue = guildData.queue || [];
    const vcs = guildData.voice_channels || [];
    const activeSb = guildData.active_soundboard || [];
    const isActive = !!track;
    const isPaused = track?.paused;

    const selVc = getGuildSelectedChannel(guildId, guildData);
    if (!guildInputState[guildId]) {
        guildInputState[guildId] = { query: '', channelId: selVc };
    } else if (!guildInputState[guildId].channelId && selVc) {
        guildInputState[guildId].channelId = selVc;
    }
    const savedQuery = escHtml(guildInputState[guildId].query || '');

    const vcOptions = vcs.map(vc => {
        const isSel = String(vc.id) === String(guildInputState[guildId].channelId) ? 'selected' : '';
        const isConn = String(vc.id) === String(guildData.connected_channel_id) ? ' 🔊' : '';
        const memInfo = vc.members > 0 ? ` (${vc.members} 👤)` : '';
        return `<option value="${escHtml(vc.id)}" ${isSel}>#${escHtml(vc.name)}${memInfo}${isConn}</option>`;
    }).join('');

    const directPlayBarHtml = `
        <div style="background:var(--void-2); border:1px solid var(--hair); padding:12px 14px; margin-bottom:18px">
            <div class="label" style="font-size:9px; margin-bottom:8px; color:var(--sigil)">▶ PŘEHRÁVÁNÍ PŘÍMO Z DASHBOARDU (YOUTUBE URL / PLAYLIST / VYHLEDÁVÁNÍ)</div>
            <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center">
                <select id="direct-vc-${guildId}" onchange="onGuildChannelChange('${guildId}', this.value)"
                    style="background:var(--void-1); color:var(--bone); border:1px solid var(--hair-strong); padding:6px 10px; font-family:var(--font-mono); font-size:11px; min-width:170px">
                    ${vcOptions || '<option value="">Žádný hlasový kanál</option>'}
                </select>
                <input id="direct-query-${guildId}" type="text" value="${savedQuery}"
                    oninput="onGuildQueryInput('${guildId}', this.value)"
                    onkeydown="if(event.key==='Enter'){directPlay('${guildId}', 'queue');}"
                    placeholder="YouTube URL, playlist nebo hledaný výraz (např. Dark Jazz Cthulhu)..."
                    style="flex:1; min-width:220px; background:var(--void-1); color:var(--bone); border:1px solid var(--hair-strong); padding:6px 10px; font-family:var(--font-mono); font-size:11px">
                <button class="btn-eld primary" onclick="directPlay('${guildId}', 'queue')">▶ PLAY / QUEUE</button>
                <button class="btn-eld" title="Zařadit hned jako další" onclick="directPlay('${guildId}', 'next')">⏭ PLAY NEXT</button>
                <button class="btn-eld" title="Okamžitě nahradit aktuální skladbu" onclick="directPlay('${guildId}', 'replace')">⚡ PLAY NOW</button>
                <button class="btn-eld rust" title="Zastavit a opustit kanál" onclick="ctrl('${guildId}', 'stop')">⏹ STOP &amp; LEAVE</button>
            </div>
        </div>`;

    let sbBadgesHtml = '';
    if (activeSb.length > 0) {
        const pills = activeSb.map(sb =>
            `<span class="badge bg-info text-dark" style="font-family:var(--font-mono); font-size:9px; border-radius:0">◐ ${escHtml(sb.file)} (${sb.volume}%${sb.loop ? ' · LOOP' : ''})</span>`
        ).join(' ');
        sbBadgesHtml = `
            <div style="margin-bottom:14px; display:flex; align-items:center; gap:8px; flex-wrap:wrap">
                <span class="mono" style="font-size:10px; color:var(--bone-fade)">ACTIVE AMBIENCE LAYERS:</span>
                ${pills}
                <button class="btn-eld rust" style="padding:2px 8px; font-size:9px" onclick="stopSoundboardLoops('${guildId}')">🔇 FADE OUT AMBIENCE</button>
            </div>`;
    }

    let nowPlayingHtml = `<div class="text-center py-4"><div class="serif-i text-muted" style="font-size:18px">The air is silent...</div><div class="label mt-2">Spusťte hudbu nebo scénický preset přímo z panelu výše</div></div>`;

    if (isActive) {
        const title = escHtml(track.title || 'Unknown');
        const url = track.url ? escHtml(track.url) : '';
        const thumbnail = track.thumbnail ? escHtml(track.thumbnail) : '';
        const vol = track.volume ?? 50;
        const loopMode = track.loop_mode ?? 'off';
        
        const loopLabel = loopMode === 'track' ? '✧ TRACK' : loopMode === 'queue' ? '◎ QUEUE' : 'OFF';
        const loopClass = loopMode !== 'off' ? 'primary' : '';

        const art = thumbnail
            ? `<img src="${thumbnail}" alt="cover" class="track-art">`
            : `<div class="track-art-placeholder">♪</div>`;

        const titleHtml = url
            ? `<a href="${url}" target="_blank" rel="noopener">${title}</a>`
            : title;

        const pauseBtn = isPaused
            ? `<button class="btn-eld primary" onclick="ctrl('${guildId}', 'resume')">⌁ RESUME</button>`
            : `<button class="btn-eld" onclick="ctrl('${guildId}', 'pause')">⏸ PAUSE</button>`;

        const progHtml = progressBar(track.elapsed, track.duration, guildId);

        nowPlayingHtml = `
            <div class="now-playing">
                ${art}
                <div class="track-info">
                    <div class="track-title">${titleHtml}</div>
                    <div class="track-badges">
                        <span class="badge ${isPaused ? 'bg-warning text-dark' : 'bg-success'}" style="font-family:var(--font-mono); font-size:9px; letter-spacing:0.1em; border-radius:0">${isPaused ? 'PAUSED' : 'PLAYING'}</span>
                        <span class="badge bg-secondary" style="font-family:var(--font-mono); font-size:9px; letter-spacing:0.1em; border-radius:0">LOOP: ${loopLabel}</span>
                        ${track.is_cached ? `<span class="badge bg-info text-dark" style="font-family:var(--font-mono); font-size:9px; letter-spacing:0.1em; border-radius:0">💾 CACHED</span>` : ''}
                    </div>
                    ${progHtml}
                    <div class="volume-row">
                        <label>♪</label>
                        <input type="range" min="0" max="100" value="${vol}" 
                            oninput="this.nextElementSibling.textContent=this.value+'%'"
                            onchange="ctrl('${guildId}', 'volume', this.value)">
                        <span class="volume-pct">${vol}%</span>
                    </div>
                </div>
            </div>
            <div class="controls-row">
                ${pauseBtn}
                <button class="btn-eld" onclick="ctrl('${guildId}', 'seek', null, null, ${Math.max(0, track.elapsed - 10)})">⏪ 10s</button>
                <button class="btn-eld" onclick="ctrl('${guildId}', 'seek', null, null, ${track.elapsed + 10})">10s ⏩</button>
                <button class="btn-eld" onclick="ctrl('${guildId}', 'skip')">⌁ SKIP</button>
                <button class="btn-eld ${loopClass}" onclick="ctrl('${guildId}', 'loop')">◎ LOOP MODE</button>
                <button class="btn-eld rust" onclick="banTrack('${guildId}', '${url}')">⌫ BAN SONG</button>
            </div>`;
    }

    let queueHtml = '';
    if (queue.length > 0) {
        const rows = queue.slice(0,10).map((s, i) => {
            const t = escHtml(s.title || 'Unknown');
            const dur = fmtDur(s.duration);
            const cacheBadge = s.is_cached ? ' <span title="Cached locally">💾</span>' : '';
            const url = s.original_url ? escHtml(s.original_url) : '';
            const titleEl = url
                ? `<a href="${url}" target="_blank" rel="noopener" class="queue-item-title text-decoration-none">${i+1}. ${t}${cacheBadge}</a>`
                : `<span class="queue-item-title">${i+1}. ${t}${cacheBadge}</span>`;
            return `<div class="queue-item">
                        <div style="display:flex;align-items:center;gap:0.4rem;min-width:0;">${titleEl}</div>
                        <div style="display:flex;align-items:center;flex-shrink:0;">
                            ${dur ? `<span class="queue-item-dur">${dur}</span>` : ''}
                            <button class="btn-eld rust" style="padding:2px 6px; font-size:8px; border:0" onclick="ctrl('${guildId}', 'remove', null, ${i})">✕</button>
                        </div>
                    </div>`;
        }).join('');
        const moreNote = queue.length > 10 ? `<div class="p-3 text-center label" style="font-size:9px; color:var(--bone-fade)">…AND ${queue.length - 10} MORE TRACKS IN THE VOID</div>` : '';
        queueHtml = `<div class="queue-section">
            <div class="queue-title">Ψ Upcoming Resonance (${queue.length})</div>
            ${rows}${moreNote}
        </div>`;
    }

    return `
        <div class="music-card" id="guild-card-${guildId}">
            <window.Corners/>
            <div class="music-card-header" style="justify-content:space-between; flex-wrap:wrap">
                <div style="display:flex; align-items:center; gap:12px">
                    <span class="serif" style="color:var(--sigil); font-size:24px">✶</span>
                    <span class="guild-name">${escHtml(guildData.name || guildId)}</span>
                </div>
                ${guildData.connected_channel_id ? `<span class="badge bg-success" style="font-family:var(--font-mono); font-size:9px; border-radius:0">🔊 VOICE CONNECTED</span>` : `<span class="badge bg-secondary" style="font-family:var(--font-mono); font-size:9px; border-radius:0">IDLE</span>`}
            </div>
            <div class="music-body">
                ${directPlayBarHtml}
                ${sbBadgesHtml}
                ${nowPlayingHtml}
            </div>
            ${queueHtml}
        </div>`;
}

function renderScenesPanel(data) {
    const scenesEl = document.getElementById('scenes-container');
    if (!scenesEl) return;
    if (sceneEditorOpen && scenesEl.contains(document.activeElement)) return;

    const rawScenes = data.scenes || [];
    const sceneList = Array.isArray(rawScenes)
        ? rawScenes
        : Object.entries(rawScenes).map(([k, v]) => ({ id: k, ...v }));
    const sbFiles = data.soundboard_files || [];
    const guilds = data.guilds || {};
    const guildEntries = Object.entries(guilds);

    const sbOptions = `<option value="">-- Žádný zvuk --</option>` + sbFiles.map(f => {
        if (typeof f === 'string') return `<option value="${escHtml(f)}">${escHtml(f)}</option>`;
        return `<option value="${escHtml(f.file)}">${escHtml(f.folder ? `[${f.folder}] ` : '')}${escHtml(f.name)} (${escHtml(f.file)})</option>`;
    }).join('');

    const sceneCards = sceneList.map(sc => {
        const sceneId = sc.id || sc.scene_id || sc.name;
        const icon = escHtml(sc.icon || '🕯️');
        const name = escHtml(sc.name || sceneId);
        const musicUrl = escHtml(sc.music_url || sc.music_query || '');
        const musicVol = sc.music_volume ?? 35;
        const musicLoop = escHtml(sc.music_loop || 'track');
        const sbList = Array.isArray(sc.soundboard) ? sc.soundboard : (Array.isArray(sc.soundboard_tracks) ? sc.soundboard_tracks : []);

        const sbSummary = sbList.length > 0
            ? sbList.map(item => `<span class="badge bg-secondary" style="font-family:var(--font-mono); font-size:9px; border-radius:0">◐ ${escHtml(item.file || item.file_path)} (${item.volume ?? 60}%${item.loop !== false ? ' · LOOP' : ''})</span>`).join(' ')
            : `<span class="mono" style="font-size:10px; color:var(--bone-fade)">Bez soundboard vrstvy</span>`;

        const activateBtns = guildEntries.map(([gId, gData]) =>
            `<button class="btn-eld primary" style="padding:4px 10px; font-size:10px" onclick="activateScene('${escHtml(sceneId)}', '${escHtml(gId)}')">▶ ${escHtml(gData.name || gId)}</button>`
        ).join(' ');

        return `
            <div style="background:var(--void-2); border:1px solid var(--hair); padding:14px; display:flex; flex-direction:column; justify-content:space-between; gap:10px">
                <div>
                    <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:8px">
                        <div class="serif" style="font-size:1.15rem; color:var(--bone)">${icon} ${name}</div>
                        <button class="btn-eld rust" style="padding:2px 6px; font-size:9px" onclick="deleteScene('${escHtml(sceneId)}')">✕</button>
                    </div>
                    <div class="mono" style="font-size:10px; color:var(--bone-fade); margin-top:6px; word-break:break-all">
                        ♪ ${musicUrl ? `${musicUrl} (${musicVol}%, loop: ${musicLoop})` : 'Bez YouTube stopy'}
                    </div>
                    <div style="margin-top:8px; display:flex; gap:4px; flex-wrap:wrap">${sbSummary}</div>
                </div>
                <div style="display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; border-top:1px solid var(--hair); padding-top:8px">
                    ${activateBtns}
                </div>
            </div>`;
    }).join('');

    scenesEl.innerHTML = `
        <div class="music-card" style="margin-bottom:1.5rem">
            <div class="music-card-header" style="justify-content:space-between; flex-wrap:wrap">
                <div style="display:flex; align-items:center; gap:12px">
                    <span class="serif" style="color:var(--sigil); font-size:20px">🕯️</span>
                    <span class="guild-name" style="font-size:1.1rem">Ambience Scenes (Scénické Presety)</span>
                    <span class="mono" style="font-size:10px; color:var(--bone-fade)">YouTube hudba + nekonečné Soundboard smyčky s plynulým prolínáním</span>
                </div>
                <div style="display:flex; gap:8px">
                    ${sceneList.length === 0 ? `<button class="btn-eld" onclick="createStarterScenes()">✨ NAČÍST VZOROVÉ SCÉNY</button>` : ''}
                    <button class="btn-eld primary" onclick="toggleSceneEditor()">${sceneEditorOpen ? '▲ ZAVŘÍT EDITOR' : '＋ NOVÝ SCÉNICKÝ PRESET'}</button>
                </div>
            </div>
            <div class="music-body" style="padding:1rem 1.5rem">
                ${sceneList.length > 0
                    ? `<div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(290px, 1fr)); gap:12px">${sceneCards}</div>`
                    : `<div class="mono text-center py-3" style="font-size:11px; color:var(--bone-fade)">Zatím nemáte uložené žádné scénické presety. Klikněte na „＋ NOVÝ SCÉNICKÝ PRESET“ nebo „✨ NAČÍST VZOROVÉ SCÉNY“.</div>`
                }

                <div id="scene-editor-box" style="display:${sceneEditorOpen ? 'block' : 'none'}; margin-top:16px; padding-top:16px; border-top:1px solid var(--hair)">
                    <div class="label" style="margin-bottom:10px; color:var(--sigil)">Vytvořit / Upravit Scénický Preset</div>
                    <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:10px; margin-bottom:12px">
                        <div>
                            <div class="mono" style="font-size:10px; color:var(--bone-fade); margin-bottom:4px">Ikona</div>
                            <input id="sc-icon" type="text" value="🌧️" style="width:100%; background:var(--void-2); color:var(--bone); border:1px solid var(--hair-strong); padding:5px 8px; font-family:var(--font-mono); font-size:11px">
                        </div>
                        <div>
                            <div class="mono" style="font-size:10px; color:var(--bone-fade); margin-bottom:4px">Název scény</div>
                            <input id="sc-name" type="text" placeholder="např. Deštivý Arkham" style="width:100%; background:var(--void-2); color:var(--bone); border:1px solid var(--hair-strong); padding:5px 8px; font-family:var(--font-mono); font-size:11px">
                        </div>
                        <div>
                            <div class="mono" style="font-size:10px; color:var(--bone-fade); margin-bottom:4px">YouTube URL nebo hledaný výraz</div>
                            <input id="sc-music-url" type="text" placeholder="URL nebo např. Dark Jazz Noir Ambience" style="width:100%; background:var(--void-2); color:var(--bone); border:1px solid var(--hair-strong); padding:5px 8px; font-family:var(--font-mono); font-size:11px">
                        </div>
                        <div>
                            <div class="mono" style="font-size:10px; color:var(--bone-fade); margin-bottom:4px">Hlasitost hudby (%) &amp; Smyčka</div>
                            <div style="display:flex; gap:6px">
                                <input id="sc-music-vol" type="number" min="0" max="100" value="35" style="width:70px; background:var(--void-2); color:var(--bone); border:1px solid var(--hair-strong); padding:5px 8px; font-family:var(--font-mono); font-size:11px">
                                <select id="sc-music-loop" style="flex:1; background:var(--void-2); color:var(--bone); border:1px solid var(--hair-strong); padding:5px 8px; font-family:var(--font-mono); font-size:11px">
                                    <option value="track" selected>Loop Track</option>
                                    <option value="queue">Loop Queue</option>
                                    <option value="off">Bez smyčky</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="mono" style="font-size:10px; color:var(--bone-fade); margin-bottom:6px">Soundboard vrstvy (např. déšť, praskání ohně, šepot):</div>
                    <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); gap:8px; margin-bottom:12px">
                        ${[0, 1, 2].map(idx => `
                            <div style="display:flex; gap:6px; align-items:center; background:var(--void-2); padding:6px 8px; border:1px solid var(--hair)">
                                <select id="sc-sb-file-${idx}" style="flex:1; min-width:0; background:var(--void-1); color:var(--bone); border:1px solid var(--hair); padding:4px; font-family:var(--font-mono); font-size:10px">
                                    ${sbOptions}
                                </select>
                                <input id="sc-sb-vol-${idx}" type="number" min="0" max="100" value="55" title="Hlasitost %" style="width:52px; background:var(--void-1); color:var(--bone); border:1px solid var(--hair); padding:4px; font-family:var(--font-mono); font-size:10px">
                                <label class="mono" style="font-size:9px; color:var(--bone-fade); display:flex; align-items:center; gap:3px; margin:0">
                                    <input id="sc-sb-loop-${idx}" type="checkbox" checked> LOOP
                                </label>
                            </div>
                        `).join('')}
                    </div>
                    <button class="btn-eld primary" onclick="saveSceneFromEditor()">💾 ULOŽIT SCÉNICKÝ PRESET</button>
                </div>
            </div>
        </div>`;
}

function toggleSceneEditor() {
    sceneEditorOpen = !sceneEditorOpen;
    if (latestMusicData) renderScenesPanel(latestMusicData);
}

async function saveSceneFromEditor() {
    const name = (document.getElementById('sc-name')?.value || '').trim();
    if (!name) { alert('Zadejte název scény.'); return; }
    const icon = (document.getElementById('sc-icon')?.value || '🕯️').trim();
    const musicUrl = (document.getElementById('sc-music-url')?.value || '').trim();
    const musicVol = parseInt(document.getElementById('sc-music-vol')?.value || '35', 10);
    const musicLoop = document.getElementById('sc-music-loop')?.value || 'track';

    const soundboard = [];
    for (let i = 0; i < 3; i++) {
        const f = document.getElementById(`sc-sb-file-${i}`)?.value;
        const v = parseInt(document.getElementById(`sc-sb-vol-${i}`)?.value || '55', 10);
        const l = !!document.getElementById(`sc-sb-loop-${i}`)?.checked;
        if (f) soundboard.push({ file: f, volume: v, loop: l });
    }

    await fetch('/api/music/scenes', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            action: 'save',
            scene: { name, icon, music_url: musicUrl, music_volume: musicVol, music_loop: musicLoop, soundboard }
        })
    });
    sceneEditorOpen = false;
    await updateMusicData(true);
}

async function createStarterScenes() {
    const starters = [
        {
            scene_id: 'arkham_rain_jazz',
            name: 'Deštivý Arkham (1920s Noir)',
            icon: '🌧️',
            music_url: '1920s dark jazz noir detective ambience instrumental',
            music_volume: 30,
            music_loop: 'track',
            soundboard: []
        },
        {
            scene_id: 'occult_ritual_crypt',
            name: 'Okultní Rituál v Kryptě',
            icon: '🕯️',
            music_url: 'Call of Cthulhu dark ritual drone ambient music',
            music_volume: 35,
            music_loop: 'track',
            soundboard: []
        },
        {
            scene_id: 'eldritch_combat',
            name: 'Střet s Mýtem (Boj / Útěk)',
            icon: '⚔️',
            music_url: 'dark orchestral horror combat ost',
            music_volume: 55,
            music_loop: 'track',
            soundboard: []
        }
    ];
    for (const sc of starters) {
        await fetch('/api/music/scenes', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'save', scene: sc })
        });
    }
    await updateMusicData(true);
}

async function deleteScene(sceneId) {
    if (!confirm('Smazat tento scénický preset?')) return;
    await fetch('/api/music/scenes', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'delete', scene_id: sceneId })
    });
    await updateMusicData(true);
}

async function activateScene(sceneId, guildId) {
    const vcSelect = document.getElementById(`direct-vc-${guildId}`);
    const channelId = vcSelect ? vcSelect.value : (guildInputState[guildId]?.channelId || '');
    const resp = await fetch('/api/music/scenes', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'activate', scene_id: sceneId, guild_id: guildId, channel_id: channelId })
    });
    const res = await resp.json().catch(() => ({}));
    if (!resp.ok || res.status === 'error') {
        alert(res.message || 'Aktivace scény selhala.');
        return;
    }
    await updateMusicData(true);
}

async function stopSoundboardLoops(guildId) {
    await fetch('/api/music/scenes', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'stop_soundboard', guild_id: guildId })
    });
    await updateMusicData(true);
}

function renderCachePanel(cache) {
    const cacheEl = document.getElementById('cache-container');
    if (!cache || !cacheEl) return;
    // Do not overwrite inputs while admin is editing them
    const activeId = document.activeElement ? document.activeElement.id : '';
    if (activeId === 'cache-max-dur' || activeId === 'cache-max-gb') return;

    const pct = cache.max_bytes > 0 ? Math.min(100, (cache.total_bytes / cache.max_bytes) * 100).toFixed(1) : '0.0';
    const enabledBadge = cache.enabled
        ? `<span class="badge bg-success" style="font-family:var(--font-mono); font-size:9px; border-radius:0">ENABLED</span>`
        : `<span class="badge bg-secondary" style="font-family:var(--font-mono); font-size:9px; border-radius:0">DISABLED</span>`;

    cacheEl.innerHTML = `
        <div class="music-card" style="margin-bottom:1.5rem">
            <div class="music-card-header" style="justify-content:space-between; flex-wrap:wrap">
                <div style="display:flex; align-items:center; gap:12px">
                    <span class="serif" style="color:var(--sigil); font-size:20px">💾</span>
                    <span class="guild-name" style="font-size:1.1rem">YouTube Audio Cache</span>
                    ${enabledBadge}
                </div>
                <div class="mono" style="font-size:11px; color:var(--bone-fade)">
                    ${cache.track_count} tracks (${cache.favorite_track_count} ❤️) · ${cache.total_mb} MB / ${cache.max_size_gb} GB (${pct}%)
                </div>
            </div>
            <div class="music-body" style="padding:1rem 1.5rem">
                <div class="progress-bar-wrapper" style="margin-bottom:14px">
                    <div class="progress-bar-fill" style="width:${pct}%"></div>
                </div>
                <div style="display:flex; gap:12px; align-items:center; flex-wrap:wrap">
                    <label class="mono" style="font-size:11px; color:var(--bone-fade)">
                        Max Track (min):
                        <input id="cache-max-dur" type="number" min="1" max="600" value="${cache.max_duration_minutes}"
                            style="width:70px; margin-left:6px; background:var(--void-2); color:var(--bone); border:1px solid var(--hair); padding:3px 6px">
                    </label>
                    <label class="mono" style="font-size:11px; color:var(--bone-fade)">
                        Max Size (GB):
                        <input id="cache-max-gb" type="number" min="0.1" max="500" step="0.5" value="${cache.max_size_gb}"
                            style="width:80px; margin-left:6px; background:var(--void-2); color:var(--bone); border:1px solid var(--hair); padding:3px 6px">
                    </label>
                    <button class="btn-eld primary" onclick="saveCacheSettings(${cache.enabled})">💾 SAVE LIMITS</button>
                    <button class="btn-eld" onclick="toggleCacheEnabled(${!cache.enabled})">${cache.enabled ? '⏸ DISABLE CACHE' : '▶ ENABLE CACHE'}</button>
                    <button class="btn-eld rust" onclick="clearAudioCache(true)">🧹 CLEAR (KEEP ❤️)</button>
                    <button class="btn-eld rust" onclick="clearAudioCache(false)">🗑️ PURGE ALL</button>
                </div>
            </div>
        </div>`;
}

async function saveCacheSettings(currentEnabled) {
    const maxDur = parseInt(document.getElementById('cache-max-dur')?.value || '30', 10);
    const maxGb = parseFloat(document.getElementById('cache-max-gb')?.value || '10');
    await fetch('/api/music/control', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            action: 'cache_settings',
            enabled: currentEnabled,
            max_duration_minutes: maxDur,
            max_size_gb: maxGb
        })
    });
    await updateMusicData(true);
}

async function toggleCacheEnabled(enable) {
    await fetch('/api/music/control', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'cache_settings', enabled: enable })
    });
    await updateMusicData(true);
}

async function clearAudioCache(keepFavorites) {
    const msg = keepFavorites
        ? 'Clear cached audio files (preserving ❤️ Favorites)?'
        : 'Purge ALL cached audio files including ❤️ Favorites?';
    if (!confirm(msg)) return;
    await fetch('/api/music/control', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'clear_cache', keep_favorites: keepFavorites })
    });
    await updateMusicData(true);
}

async function upgradeYtdlpNow() {
    const btn = document.getElementById('btn-upgrade-ytdlp');
    if (btn) { btn.disabled = true; btn.textContent = '⏳ UPGRADING YT-DLP...'; }
    try {
        const resp = await fetch('/api/music/control', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'upgrade_ytdlp' })
        });
        const d = await resp.json().catch(() => ({}));
        alert(`yt-dlp status: ${d.ytdlp_status || 'hotovo'}`);
    } finally {
        await updateMusicData(true);
    }
}

function renderDiagnosticsPanel(diag, ytdlpStatus, ytdlpCheckedAt) {
    const diagEl = document.getElementById('diag-container');
    if (!diag || !diagEl) return;
    const env = escHtml(diag.env || '');
    const procs = escHtml(diag.processes || '');
    const vlogs = escHtml(diag.voice_logs || 'No voice logs recorded yet.');
    const hasDup = env.includes('DUPLICATE');
    const borderStyle = hasDup ? 'border-color:#dc3545' : '';
    const ytStat = escHtml(ytdlpStatus || 'Auto-update active (24h loop)');
    const ytTime = ytdlpCheckedAt ? ` · Last check: ${escHtml(ytdlpCheckedAt)}` : '';

    diagEl.innerHTML = `
        <div class="music-card" style="margin-bottom:1.5rem; ${borderStyle}">
            <div class="music-card-header" style="justify-content:space-between; flex-wrap:wrap">
                <div style="display:flex; align-items:center; gap:12px">
                    <span class="serif" style="color:var(--sigil); font-size:20px">🩺</span>
                    <span class="guild-name" style="font-size:1.1rem">Voice &amp; Process Diagnostics</span>
                    ${hasDup ? `<span class="badge bg-danger" style="font-family:var(--font-mono); font-size:9px; border-radius:0">⚠️ DUPLICATE BOT PROCESS</span>` : ''}
                </div>
                <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap">
                    <span class="mono" style="font-size:10px; color:var(--bone-fade)">yt-dlp: <strong style="color:var(--sigil)">${ytStat}</strong>${ytTime}</span>
                    <button id="btn-upgrade-ytdlp" class="btn-eld" style="padding:3px 10px; font-size:9px" onclick="upgradeYtdlpNow()">↻ UPGRADE YT-DLP NOW</button>
                </div>
            </div>
            <div class="music-body" style="padding:1rem 1.5rem; font-family:var(--font-mono); font-size:11px; color:var(--bone-dim)">
                <div style="margin-bottom:8px"><strong>Environment:</strong> ${env}</div>
                <div style="margin-bottom:8px"><strong>Processes:</strong><pre style="margin:4px 0 0; padding:8px; background:var(--void-2); border:1px solid var(--hair); color:var(--bone); white-space:pre-wrap">${procs}</pre></div>
                <details>
                    <summary style="cursor:pointer; color:var(--sigil)">Discord Voice / Player Logs</summary>
                    <pre style="margin:6px 0 0; padding:8px; background:var(--void-2); border:1px solid var(--hair); color:var(--bone); max-height:220px; overflow-y:auto; white-space:pre-wrap">${vlogs}</pre>
                </details>
            </div>
        </div>`;
}

async function updateMusicData(forceRender = false) {
    try {
        const resp = await fetch('/api/music/data', { cache: 'no-store' });
        if (!resp.ok) return;
        const data = await resp.json();
        latestMusicData = data;
        if (data.cache) {
            renderCachePanel(data.cache);
        }
        renderScenesPanel(data);
        if (data.diagnostics) {
            renderDiagnosticsPanel(data.diagnostics, data.ytdlp_status, data.ytdlp_checked_at);
        }
        const container = document.getElementById('guilds-container');
        // Do not clobber guild input focus while typing
        if (!forceRender && container && container.contains(document.activeElement)) {
            const tag = document.activeElement.tagName;
            if (tag === 'INPUT' || tag === 'SELECT') return;
        }

        if (!data.guilds || Object.keys(data.guilds).length === 0) {
            container.innerHTML = `
                <div class="card-h p-5 text-center">
                    <window.Corners/>
                    <div class="serif-i text-muted" style="font-size:22px">No active music sessions.</div>
                    <div class="label mt-3">The cosmic silence is absolute.</div>
                </div>`;
            return;
        }

        container.innerHTML = Object.entries(data.guilds)
            .map(([id, g]) => renderGuild(id, g))
            .join('');
    } catch(e) {
        console.error('Music data fetch failed', e);
    }
}

async function ctrl(guildId, action, volume = null, index = null, seconds = null) {
    await fetch('/api/music/control', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ guild_id: guildId, action, volume, index, seconds })
    });
    await updateMusicData(true);
}

async function banTrack(guildId, url) {
    if (!url) { alert('No URL for this track.'); return; }
    if (!confirm('Ban this song? It will be skipped and blacklisted.')) return;
    await fetch('/api/music/ban', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url })
    });
    await updateMusicData(true);
}

// Start auto-refresh
refreshTimer = setInterval(updateMusicData, REFRESH_MS);
updateMusicData(true);
</script>
{% endblock %}
